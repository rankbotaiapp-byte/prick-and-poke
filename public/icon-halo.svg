      <stop offset="0" stop-color="#5ce1e6"/>
      <stop offset="0.22" stop-color="#7a6cff"/>
      <stop offset="0.45" stop-color="#ff5c8a"/>
      <stop offset="0.68" stop-color="#ff8a4c"/>
      <stop offset="0.86" stop-color="#f0c05a"/>
