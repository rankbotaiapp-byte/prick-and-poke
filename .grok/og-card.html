<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: "Syne";
    font-weight: 800;
    src: url("fonts/syne-800.woff2") format("woff2"),
         url("fonts/syne-800.ttf") format("truetype");
  }
  @font-face {
    font-family: "Figtree";
    font-weight: 500;
    src: url("fonts/figtree-500.ttf") format("truetype");
  }
  html, body {
    margin: 0;
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #070708;
    color: #f2f1ed;
    -webkit-font-smoothing: antialiased;
  }
  .stage {
    position: relative;
    width: 1200px;
    height: 630px;
    display: grid;
    place-items: center;
    background:
      radial-gradient(90% 70% at 18% 18%, rgba(92, 225, 230, 0.22), transparent 52%),
      radial-gradient(80% 70% at 88% 82%, rgba(255, 92, 138, 0.20), transparent 50%),
      radial-gradient(50% 40% at 50% 50%, rgba(240, 192, 90, 0.08), transparent 62%),
      linear-gradient(180deg, #101014 0%, #070708 100%);
  }
  .stage::after {
    content: "";
    position: absolute;
    inset: 0;
    opacity: 0.16;
    pointer-events: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='80' height='80'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.55'/></svg>");
    mix-blend-mode: overlay;
  }
  .phone {
    position: relative;
    width: 236px;
    height: 484px;
    border-radius: 36px;
    background: #070708;
    box-shadow:
      0 0 0 1px rgba(242, 241, 237, 0.08),
      0 28px 80px rgba(0, 0, 0, 0.55);
  }
  .halo {
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
  }
  .halo-bloom,
  .halo-line {
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: conic-gradient(from 210deg, #5ce1e6, #7a6cff, #ff5c8a, #ff8a4c, #f0c05a, #4dffb4, #5ce1e6);
    -webkit-mask:
      linear-gradient(#000 0 0) content-box,
      linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask:
      linear-gradient(#000 0 0) content-box,
      linear-gradient(#000 0 0);
    mask-composite: exclude;
  }
  .halo-bloom {
    padding: 11px;
    filter: blur(16px);
    opacity: 0.72;
  }
  .halo-line {
    padding: 3px;
  }
  .screen {
    position: absolute;
    inset: 10px;
    border-radius: 26px;
    background:
      radial-gradient(90% 70% at 20% 16%, rgba(92, 225, 230, 0.16), transparent 50%),
      radial-gradient(80% 70% at 88% 88%, rgba(255, 92, 138, 0.14), transparent 48%),
      #070708;
  }
  .pill {
    position: absolute;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    width: 54px;
    height: 8px;
    border-radius: 99px;
    background: #f2f1ed;
    opacity: 0.22;
  }
  .home {
    position: absolute;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    width: 72px;
    height: 4px;
    border-radius: 99px;
    background: #f2f1ed;
    opacity: 0.16;
  }
  .lockup {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    z-index: 2;
    pointer-events: none;
  }
  h1 {
    margin: 0;
    font-family: Syne, ui-sans-serif, system-ui, sans-serif;
    font-weight: 800;
    font-size: 108px;
    letter-spacing: 0.32em;
    margin-right: -0.32em;
    color: #f2f1ed;
    line-height: 1;
    text-align: center;
    text-shadow:
      0 0 40px rgba(7, 7, 8, 0.85),
      0 2px 24px rgba(7, 7, 8, 0.9);
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="phone" aria-hidden="true">
      <div class="halo">
        <div class="halo-bloom"></div>
        <div class="halo-line"></div>
      </div>
      <div class="screen">
        <div class="pill"></div>
        <div class="home"></div>
      </div>
    </div>
    <div class="lockup">
      <h1>AXIOM</h1>
    </div>
  </div>
</body>
</html>
